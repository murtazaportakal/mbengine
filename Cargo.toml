[workspace]
members = ["game"]
default-members = [".", "game"]

[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Custom game engine — Data-Oriented Design, custom allocators, ECS"
default-run = "engine"

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "engine"
path = "src/main.rs"

[[bin]]
name = "packer"
path = "src/bin/packer.rs"

[[bin]]
name = "cooker"
path = "src/bin/cooker.rs"


[[test]]
name = "test_ecs"
path = "tests/test_ecs.rs"

[features]
# `editor` gates all IMGUI, file browser, hot-reload, and scene-inspector code.
# Enabled by default so normal `cargo run` includes the full editor.
default = ["editor"]
editor = []
# `standalone` strips the editor and statically links game logic.
# Usage: cargo build --release --features standalone
standalone = []

[profile.dev]
opt-level = 1
overflow-checks = true
# Maximize parallelism for fast incremental compilation
codegen-units = 256
# Pack debug info into a separate file — massively reduces link time on Windows
split-debuginfo = "packed"

# Optimize heavy math/physics dependencies even in dev builds.
# Without this, rapier3d and nalgebra run ~50-100× slower in debug,
# and the linker processes much larger unoptimized object files.
[profile.dev.package.rapier3d]
opt-level = 2
[profile.dev.package.nalgebra]
opt-level = 2
[profile.dev.package.simba]
opt-level = 2
[profile.dev.package.parry3d]
opt-level = 2
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.rodio]
opt-level = 2

[profile.release]
opt-level = 3
lto = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
ash = "0.38"
image = { version = "0.25", features = ["hdr"] }
memoffset = "0.9.1"
tobj = "4.0"
rapier3d = "0.17"
nalgebra = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1.1"
libloading = "0.8"
ab_glyph = "0.2"
meshopt = "0.3"
rodio = "0.17.3"

gltf = { version = "1.4", features = ["KHR_lights_punctual", "KHR_materials_emissive_strength", "KHR_materials_ior", "KHR_materials_pbrSpecularGlossiness", "KHR_materials_specular", "KHR_materials_transmission", "KHR_materials_unlit", "KHR_materials_variants", "KHR_materials_volume", "KHR_texture_transform", "extensions", "extras", "guess_mime_type"] }
rfd = "0.17.2"
rhai = "1.19"
memmap2 = "0.9"
